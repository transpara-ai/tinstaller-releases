name: Verify migration helpers

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-migration-helpers:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Check helper syntax and shell diagnostics
        run: |
          bash -n migration.sh fix-skipped-migrations.sh
          shellcheck --version
          shellcheck -s bash migration.sh fix-skipped-migrations.sh

      - name: Exercise migration helper failure boundaries
        run: python scripts/test-migration-helpers.py
